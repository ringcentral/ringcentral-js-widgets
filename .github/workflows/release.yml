name: Release

# Tags:
#   1.0.0, 1.1.0-rc.0   -> all unified packages at that version
#   i18n@2.4.0          -> one independently versioned package
# See scripts/publishPackages.mjs.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'i18n@*'
      - 'locale-loader@*'
      - 'phone-number@*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. 1.0.0-rc.0 or i18n@2.4.0'
        required: true
      dry_run:
        description: 'Build and run npm publish --dry-run only'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: npm run lockfile:check
      - run: npm ci
      - name: Publish
        run: node scripts/publishPackages.mjs "$RELEASE_TAG" $DRY_RUN
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
