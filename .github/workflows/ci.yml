name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run lockfile:check

  tests:
    needs: lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - babel-settings
          - utils
          - i18n
          - locale-loader
          - phone-number
          - core
          - react-hooks
          - commons
          - widgets
          - next-core
          - next-integration
          - next-micro
          - next-widgets
          - next-builder
          - micro-core
          - micro-auth
          - micro-contacts
          - micro-coworker
          - micro-meeting
          - micro-message
          - micro-phone
          - micro-setting
          - rjsf-juno
          - rjsf-spring
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # *.snap files are gitignored, so snapshots are written fresh on each run;
      # --ci alone would refuse to write them and fail every snapshot test.
      - run: npm test -w @ringcentral-integration/${{ matrix.package }} -- --ci --coverage --updateSnapshot
        env:
          # Type errors are reported by the typecheck job instead.
          SKIP_TSC_CHECK: 'true'
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: ${{ matrix.package }}
          parallel: true
          fail-on-error: false

  # The app-demo-test integration suite is too large for one job: each segment
  # of next/app-demo-test/scripts/run-react18-segmented-tests.js runs in band
  # in its own job, and fails if it executes no passing tests.
  app-demo-test:
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        segment:
          - common-widgets-ha
          - common-widgets-messages
          - common-widgets-settings
          - common-widgets-call
          - common-widgets-small
          - common-widgets-cross-module
          - crm-common
          - misc-top-level
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # *.snap files are gitignored, so snapshots must be written fresh in CI.
      - run: npm run test:react18-segmented -w @ringcentral-integration/app-demo-test -- --updateSnapshot
        env:
          REACT18_TEST_SEGMENTS: ${{ matrix.segment }}

  typecheck:
    needs: lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - react-hooks
          - widgets
          - next-core
          - next-micro
          - next-widgets
          - micro-core
          - micro-auth
          - micro-contacts
          - micro-coworker
          - micro-meeting
          - micro-message
          - micro-phone
          - micro-setting
          - rjsf-juno
          - rjsf-spring
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: tsc-check
        run: |
          set +e
          npm run tsc-check -w @ringcentral-integration/${{ matrix.package }} > tsc.log 2>&1
          code=$?
          cat tsc.log
          errors=$(grep -c 'error TS' tsc.log)
          echo "### ${{ matrix.package }}: ${errors} type error(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error title=Type errors in ${{ matrix.package }}::${errors} type error(s), see the typecheck job log"
          fi
          exit $code

  coverage:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false
